<!doctype html><html lang="en"><meta charset="utf-8"><title>Commonweal responsive QA</title><style>body{margin:0;background:#ddd;font:14px system-ui}h1,h2,p{margin:15px} .desktop{width:1440px;height:980px;border:0;transform:scale(.42);transform-origin:top left}.desktop-wrap{height:412px;overflow:hidden}.mobile{width:390px;height:844px;border:0;margin:15px}.check{position:absolute;left:-10000px;width:390px;height:844px;border:0}li{margin:6px}button{padding:10px;margin:15px}</style><h1>Commonweal responsive QA</h1><h2>Desktop · 1440px</h2><div class="desktop-wrap"><iframe title="Desktop preview" class="desktop" src="/"></iframe></div><h2>Phone · 390px</h2><iframe title="Phone preview" class="mobile" src="/"></iframe><h2>Layout checks</h2><ul id="results"></ul><script>
const routes=['/','/commons/','/commonwealths/','/governance/','/participate/','/culture/','/read/manifesto/','/read/principles/','/privacy/'];
(async()=>{for(const width of [390,768,1024,1440])for(const route of routes){const frame=document.createElement('iframe');frame.className='check';frame.style.width=width+'px';frame.src=route;await new Promise(resolve=>{frame.onload=resolve;document.body.append(frame)});await frame.contentDocument.fonts.ready;const d=frame.contentDocument;const overflow=d.documentElement.scrollWidth>width;const item=document.createElement('li');item.textContent=`${overflow?'FAIL':'PASS'} ${width}px ${route} — content width ${d.documentElement.scrollWidth}px`;if(overflow)item.textContent+=' '+[...d.querySelectorAll('main *')].filter(e=>e.getBoundingClientRect().right>width).map(e=>e.tagName+'.'+e.className).join(', ');document.querySelector('#results').append(item);frame.remove();}document.body.dataset.complete='true';})();
</script></html>
